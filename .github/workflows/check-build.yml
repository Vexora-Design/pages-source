name: Validate VEXORA source
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install official npm dependencies
        run: npm install --no-audit --no-fund
      - name: Check files
        run: npm run check
      - name: Build to temporary sibling directory
        run: npm run build -- --out "$RUNNER_TEMP/vexora-build"
